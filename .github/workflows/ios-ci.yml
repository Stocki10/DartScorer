name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build and Test
        run: |
          xcodebuild test \
            -project DartScorer_Ios/DartScorer.xcodeproj \
            -scheme DartScorer \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath /tmp/DartScorerDerivedData
